name: Lint

on:
  pull_request:
    paths:
      - index.js
  push:
    paths:
      - index.js

jobs:
  XO:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npx xo --ignore=distribution/**
